services:
  - type: web
    name: medmon-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medmon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # you will be prompted for this in the dashboard
      - key: CORS_ORIGINS
        value: "*"             # change to your frontend URL, e.g. https://app.example.com

databases:
  - name: medmon-db
    plan: free
    databaseName: medmon
    user: medmon
